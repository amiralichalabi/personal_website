name: Site checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install beautifulsoup4
      - name: Persian pages are up to date
        run: |
          python3 build/build.py
          git diff --exit-code -- fa/ || (echo "fa/ is stale: run python3 build/build.py and commit" && exit 1)
      - name: No inline styles/scripts (CSP) and no leftover placeholders
        run: |
          if grep -nE ' style="|<script>[^<]' index.html research.html 404.html fa/*.html; then echo "inline style/script found (blocked by CSP)"; exit 1; fi
          if grep -rn "YOUR-DOMAIN" index.html research.html fa/ sitemap.xml robots.txt; then echo "domain placeholder left"; exit 1; fi
      - name: No phone numbers
        run: |
          if grep -rnE "\+98 ?9[0-9]{2}|09[0-9]{9}" --include="*.html" --include="*.md" --include="*.json" --include="*.xml" .; then echo "phone number found"; exit 1; fi
